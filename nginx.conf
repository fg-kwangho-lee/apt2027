server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 한글 파일명·한글 본문이 깨지지 않도록 UTF-8 명시
    charset utf-8;
    charset_types text/html text/plain text/css text/csv application/json application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    # 정적 자산 캐시 (HTML 은 항상 최신을 받도록 캐시하지 않음)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
