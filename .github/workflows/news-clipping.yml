name: 일룸 뉴스클리핑

on:
  schedule:
    - cron: '30 23 * * 1-5'  # 서울 기준 월~금 오전 8:30 (UTC 23:30)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스클리핑 실행
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node news-clipping.mjs
