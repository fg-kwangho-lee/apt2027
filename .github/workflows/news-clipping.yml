name: 일룸 뉴스클리핑

on:
  workflow_dispatch:  # cron-job.org에서 매일 08:30 KST 월~금 호출

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스클리핑 실행
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node news-clipping.mjs
